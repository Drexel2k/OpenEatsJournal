name: openeatsjournal
description: "Open Eats Journal is a free, data minimized and privacy friendly open source eats journal to track your food intake, nutritions, calories and weight."
publish_to: 'none'
version: 1.16.0+33

environment:
  sdk: ^3.8.1

dependencies:
  async: ^2.13.1
  collection: ^1.19.1
  csv: ^8.0.0
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.0
  flutter_zxing: ^2.3.0
  gauge_indicator: ^0.6.0
  graphic: ^2.6.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  sqflite_common_ffi: ^2.4.0+2
  mockito: ^5.6.3
  build_runner: ^2.11.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/